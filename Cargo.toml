[package]
name = "stalwart-operator"
version = "0.1.0"
edition = "2024"
description = "Kubernetes operator that gives apps SMTP credentials from a Stalwart mail server"
license = "Apache-2.0"
repository = "https://github.com/foli-ag/stalwart-operator"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
k8s-openapi = { version = "0.28.0", features = ["v1_36", "schemars"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "ring", "runtime", "derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
rstest = "0.28.0"
